<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Door Control</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; background: #10141c; color: #e8edf5; }
  h1 { margin-bottom: 4px; }
  .card { background: #1b2230; border-radius: 12px; padding: 20px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .status { font-size: 1.6rem; font-weight: bold; margin: 8px 0; }
  .small { color: #8a96ab; font-size: .9rem; }
  a { color: #7db3ff; }
  button { font-size: 1rem; padding: 10px 18px; margin: 4px; border: 0; border-radius: 8px; cursor: pointer; color: #fff; }
  .red { background: #d33; } .green { background: #2a2; } .blue { background: #36c; } .off { background: #555; } .beep { background: #b8860b; }
  input[type=color] { width: 60px; height: 40px; border: 0; vertical-align: middle; }
  input[type=range] { width: 60%; vertical-align: middle; }
  input[type=text] { padding: 8px; border-radius: 6px; border: 0; width: 55%; }
  .flash { animation: flash .8s; }
  @keyframes flash { from { background: #ffe66d; color: #000; } to { background: #1b2230; } }
  #bigLetter { font-size: 4rem; font-weight: bold; }
  #errors { color: #f88; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>Front Door Control</h1>
<span id="whoami" hidden></span><a id="changeKey" hidden></a>

<div class="card" id="cardA">
  <h2>Doorbell</h2>
  <div id="bigLetter">-</div>
  <div class="status" id="doorbellStatus">Waiting for the Arduino...</div>
  <div class="small" id="doorbellTime"></div>
  <div class="small">Presses since this page opened: <span id="doorbellCount">0</span></div>
  <button class="green" onclick="sendLamp('green'); sendLamp('chime')">Let them in</button>
</div>

<div class="card">
  <h2>Remote Lamp</h2>
  <button class="red" onclick="sendLamp('red')">Red</button>
  <button class="green" onclick="sendLamp('green')">Green</button>
  <button class="blue" onclick="sendLamp('blue')">Blue</button>
  <button class="off" onclick="sendLamp('off')">Off</button>
  <button class="beep" onclick="sendLamp('beep')">Beep</button>
  <div style="margin-top:12px">
    Color: <input type="color" id="picker" value="#ff8800">
    <button class="blue" onclick="sendPicker()">Send</button>
  </div>
  <div style="margin-top:12px">
    Brightness: <input type="range" id="bri" min="0" max="100" value="50" onchange="sendLamp('bri:' + this.value)">
  </div>
  <div style="margin-top:12px">
    <input type="text" id="msg" placeholder="Message for the LED matrix" maxlength="40">
    <button class="blue" onclick="sendLamp('msg:' + document.getElementById('msg').value)">Scroll</button>
  </div>
  <div class="small" id="lampStatus"></div>
</div>

<div class="card">
  <h3>Problems?</h3>
  <div id="errors" class="small">None yet.</div>
</div>

<script>
const IO_USERNAME   = "local";
const DOORBELL_FEED = "doorbell";
const LAMP_FEED     = "lamp";
const POLL_MS       = 2000;

// Key is never stored in this file; it lives in this browser only.
function getKey() {
  let key = null;
  try { key = localStorage.getItem("aio_key"); } catch (e) {}
  if (!key) {
    key = prompt("Paste your Adafruit IO key (starts with aio_). It stays in this browser only.");
    if (key) { try { localStorage.setItem("aio_key", key.trim()); } catch (e) {} }
  }
  return key ? key.trim() : "";
}
document.getElementById("changeKey").onclick = (e) => {
  e.preventDefault();
  try { localStorage.removeItem("aio_key"); } catch (e2) {}
  location.reload();
};

const IO_KEY = "";
document.getElementById("whoami").textContent = IO_USERNAME;
const BASE = "/api/feeds/";

function showError(msg) {
  document.getElementById("errors").textContent = msg;
  console.error(msg);
}

let lastSeenId = null;
let count = 0;

async function checkDoorbell() {
  try {
    const res = await fetch(BASE + DOORBELL_FEED + "/data/last", { headers: { "X-AIO-Key": IO_KEY } });
    if (res.status === 404) { showError("Feed '" + DOORBELL_FEED + "' not found."); return; }
    if (res.status === 401) { showError("401: wrong username or key. Click 'change key'."); return; }
    if (!res.ok) { showError("Adafruit IO replied " + res.status); return; }
    const data = await res.json();
    if (data.id !== lastSeenId) {
      const isFirstLoad = (lastSeenId === null);
      lastSeenId = data.id;
      if (!isFirstLoad) count++;
      showDoorbell(data.value, data.created_at, !isFirstLoad);
    }
    document.getElementById("errors").textContent = "None. Connected.";
  } catch (err) {
    showError("Could not reach Adafruit IO: " + err.message);
  }
}

const MESSAGES = {
  A: "Someone is at the door!",
  B: "Package delivered",
  C: "Go away"
};

function beepSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    o.frequency.value = 880;
    o.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.25);
  } catch (e) {}
}

function showDoorbell(value, createdAt, flash) {
  const message = MESSAGES[value] || ("Button " + value + " was pressed");
  document.getElementById("bigLetter").textContent = value;
  document.getElementById("doorbellStatus").textContent = message;
  document.getElementById("doorbellTime").textContent = "at " + new Date(createdAt).toLocaleTimeString();
  document.getElementById("doorbellCount").textContent = count;
  if (flash) {
    const card = document.getElementById("cardA");
    card.classList.remove("flash");
    void card.offsetWidth;
    card.classList.add("flash");
    beepSound();
  }
}

let lastLampSend = 0;
async function sendLamp(value) {
  const status = document.getElementById("lampStatus");
  const wait = 2000 - (Date.now() - lastLampSend);
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastLampSend = Date.now();
  status.textContent = "Sending '" + value + "'...";
  try {
    const res = await fetch(BASE + LAMP_FEED + "/data", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-AIO-Key": IO_KEY },
      body: JSON.stringify({ value: value })
    });
    if (res.status === 429) { status.textContent = "Slow down! Rate limit hit (30 per minute)."; return; }
    if (!res.ok) { status.textContent = "Adafruit IO replied " + res.status; return; }
    status.textContent = "Sent '" + value + "' at " + new Date().toLocaleTimeString();
  } catch (err) {
    status.textContent = "Could not send: " + err.message;
  }
}

function sendPicker() {
  const h = document.getElementById("picker").value;
  sendLamp(parseInt(h.slice(1,3),16) + "," + parseInt(h.slice(3,5),16) + "," + parseInt(h.slice(5,7),16));
}

checkDoorbell();
setInterval(checkDoorbell, POLL_MS);
</script>
</body>
</html>
